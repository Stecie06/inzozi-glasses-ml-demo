<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Inzozi Glasses</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        #status-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.06);
            z-index: 10;
            pointer-events: none;
        }
        #status-bar .left { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.green { background: #00ff88; box-shadow: 0 0 12px #00ff88; }
        .dot.red { background: #ff4444; box-shadow: 0 0 12px #ff4444; }
        .status-text { font-size: 10px; font-weight: 600; color: #aaa; }
        .status-text.active { color: #00ff88; }
        #lang-badge { font-size: 9px; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.15); color: #00ff88; }
        #fps-text { font-size: 9px; color: #555; }
        #speech-bubble {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 10px 20px;
            max-width: 92%;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        #speech-bubble .emoji { margin-right: 8px; font-size: 18px; }
        #speech-bubble.highlight { border-color: rgba(0,255,136,0.2); }
        #ml-status {
            position: absolute;
            top: 60px;
            right: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 9px;
            color: #666;
            text-align: right;
            border: 1px solid rgba(255,255,255,0.04);
            pointer-events: none;
            line-height: 1.6;
        }
        #ml-status .val { color: #aaa; }
        #face-tags {
            position: absolute;
            top: 60px;
            left: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            max-height: 35%;
            overflow: hidden;
        }
        .face-tag {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            padding: 2px 12px;
            font-size: 10px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.05);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .face-tag.known { border-color: rgba(0,255,136,0.15); color: #00ff88; }
        .face-tag.unknown { border-color: rgba(255,200,0,0.15); color: #ffcc00; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading .logo { font-size: 50px; margin-bottom: 15px; animation: float 2s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #loading h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #00ff88, #00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #loading p { color: #666; font-size: 13px; margin-top: 6px; }
        .spinner { width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.06); border-top-color: #00ff88; border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #always-listening-badge {
            position: absolute;
            bottom: 135px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,255,136,0.08);
            border: 1px solid rgba(0,255,136,0.1);
            border-radius: 20px;
            padding: 2px 14px;
            font-size: 9px;
            color: #00ff88;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0.6;
        }
        @media (max-width: 480px) {
            #speech-bubble { font-size: 12px; padding: 8px 14px; min-height: 34px; bottom: 70px; }
            #ml-status { font-size: 8px; padding: 4px 10px; top: 55px; right: 8px; }
            #face-tags { top: 55px; left: 8px; }
            .face-tag { font-size: 9px; padding: 2px 10px; }
            #status-bar { padding: 4px 12px; top: 8px; left: 8px; right: 8px; }
            .status-text { font-size: 9px; }
            #lang-badge { font-size: 8px; padding: 1px 8px; }
            #always-listening-badge { font-size: 8px; bottom: 115px; padding: 1px 12px; }
        }
    </style>
</head>
<body>
    <!-- MAIN CONTAINER -->
    <div id="container">
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="overlay-canvas"></canvas>
            
            <div id="status-bar">
                <div class="left">
                    <span class="dot green" id="status-dot"></span>
                    <span class="status-text active" id="status-text">LIVE</span>
                    <span id="lang-badge">🇷🇼 RW</span>
                </div>
                <div>
                    <span class="status-text" id="fps-text">0 FPS</span>
                </div>
            </div>
            
            <div id="always-listening-badge">🎤 Always Listening</div>
            
            <div id="face-tags"></div>
            
            <div id="ml-status">
                <div> <span class="val" id="face-count">0</span></div>
                <div> <span class="val" id="object-count">0</span></div>
            </div>
            
            <div id="speech-bubble">
                <span class="emoji"></span>
                <span id="speech-text">Sisitemu iteguye...</span>
            </div>
        </div>
    </div>
    
    <div id="loading" class="hidden"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    
    <script>
        (function() {
            'use strict';
            
            // ============================================================
            // STATE - DEFAULT TO KINYARWANDA
            // ============================================================
            const state = {
                isRunning: false,
                isSpeaking: false,
                stream: null,
                frameCount: 0,
                fps: 0,
                lastFpsUpdate: 0,
                detectedFaces: [],
                detectedObjects: [],
                lastSpeechTime: 0,
                speechCooldown: 4000,
                recognition: null,
                currentLanguage: 'rw',      // DEFAULT: KINYARWANDA
                languageChosen: true,       // Already chosen (default)
                lastDescription: '',
                descriptionCooldown: 5000,
                lastDescriptionTime: 0,
                waitingForLanguage: false,  // No waiting - default is Kinyarwanda
                promptCount: 0
            };
            
            // ============================================================
            // DOM ELEMENTS
            // ============================================================
            const video = document.getElementById('video');
            const canvas = document.getElementById('overlay-canvas');
            const ctx = canvas.getContext('2d');
            const speechText = document.getElementById('speech-text');
            const speechBubble = document.getElementById('speech-bubble');
            const faceTags = document.getElementById('face-tags');
            const faceCount = document.getElementById('face-count');
            const objectCount = document.getElementById('object-count');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const fpsDisplay = document.getElementById('fps-text');
            const langBadge = document.getElementById('lang-badge');
            
            // ============================================================
            // SPEAK (TTS on Phone)
            // ============================================================
            function speak(text) {
                if (state.isSpeaking) return;
                const now = Date.now();
                if (now - state.lastSpeechTime < state.speechCooldown) return;
                
                state.lastSpeechTime = now;
                state.isSpeaking = true;
                
                speechText.textContent = text;
                speechBubble.classList.add('highlight');
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = state.currentLanguage === 'rw' ? 'rw' : 'en-US';
                    utterance.rate = 0.85;
                    utterance.pitch = 1.0;
                    
                    const voices = window.speechSynthesis.getVoices();
                    if (voices.length > 0) {
                        const preferred = voices.find(v => 
                            state.currentLanguage === 'rw' ? 
                            v.lang.startsWith('rw') || v.lang.startsWith('sw') :
                            v.lang.startsWith('en')
                        );
                        if (preferred) utterance.voice = preferred;
                    }
                    
                    utterance.onend = function() {
                        state.isSpeaking = false;
                    };
                    
                    window.speechSynthesis.speak(utterance);
                }
                
                setTimeout(() => {
                    speechBubble.classList.remove('highlight');
                    state.isSpeaking = false;
                }, 3000);
            }
            
            // ============================================================
            // VOICE RECOGNITION - ALWAYS LISTENING
            // ============================================================
            function initVoiceRecognition() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    console.warn('Speech recognition not supported');
                    return null;
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'rw';      // Start in Kinyarwanda
                recognition.maxAlternatives = 5;
                
                recognition.onstart = function() {
                    console.log('🎤 Always listening...');
                    document.getElementById('always-listening-badge').style.opacity = '1';
                };
                
                recognition.onend = function() {
                    console.log(' Recognition ended, restarting...');
                    if (state.isRunning) {
                        setTimeout(() => {
                            try { 
                                if (state.recognition) {
                                    state.recognition.start();
                                }
                            } catch(e) {
                                console.warn('Restart error:', e);
                            }
                        }, 300);
                    }
                };
                
                recognition.onresult = function(event) {
                    const result = event.results[event.results.length - 1];
                    if (result.isFinal) {
                        const text = result[0].transcript;
                        console.log('🗣️ Heard:', text);
                        handleVoiceInput(text);
                    }
                };
                
                recognition.onerror = function(event) {
                    console.warn('Speech error:', event.error);
                    if (event.error !== 'not-allowed' && event.error !== 'aborted') {
                        setTimeout(() => {
                            try { 
                                if (state.recognition) {
                                    state.recognition.start();
                                }
                            } catch(e) {}
                        }, 500);
                    }
                };
                
                return recognition;
            }
            
            // ============================================================
            // HANDLE VOICE INPUT
            // ============================================================
            function handleVoiceInput(text) {
                const lower = text.toLowerCase().trim();
                console.log(' Processing:', lower);
                
                // ============================================================
                // CHECK FOR ENGLISH - ONLY WAY TO SWITCH FROM KINYARWANDA
                // ============================================================
                const enKeywords = ['english', 'en', 'ingirish', 'english'];
                for (let keyword of enKeywords) {
                    if (lower.includes(keyword)) {
                        state.currentLanguage = 'en';
                        langBadge.textContent = '🇬🇧 EN';
                        speak('Switched to English. I am ready.');
                        return;
                    }
                }
                
                // ============================================================
                // CHECK FOR KINYARWANDA (if someone wants to switch back)
                // ============================================================
                const rwKeywords = ['kinyarwanda', 'kiny', 'kinya', 'rw', 'rwanda', 'rwand'];
                for (let keyword of rwKeywords) {
                    if (lower.includes(keyword)) {
                        state.currentLanguage = 'rw';
                        langBadge.textContent = '🇷🇼 RW';
                        speak('Nahinduye ururimi mu Kinyarwanda. Nditse.');
                        return;
                    }
                }
                
                // ============================================================
                // TRIGGER DESCRIPTION
                // ============================================================
                const triggerWords = ['what', 'who', 'see', 'tell', 'describe', 'soma', 'nde', 'iki', 'ubona', 'help', 'around'];
                const shouldDescribe = triggerWords.some(w => lower.includes(w));
                
                if (shouldDescribe || lower.length > 3) {
                    describeScene();
                }
            }
            
            // ============================================================
            // DESCRIBE SCENE
            // ============================================================
            function describeScene() {
                const faces = state.detectedFaces;
                const objects = state.detectedObjects;
                const lang = state.currentLanguage;
                
                if (faces.length === 0 && objects.length === 0) {
                    speak(lang === 'rw' ? 'Nta kintu cyabonetse' : 'Nothing detected');
                    return;
                }
                
                const parts = [];
                
                // Describe people
                for (let face of faces) {
                    let desc = face.name;
                    if (face.position) {
                        desc += lang === 'rw' ? ` ${face.position}` : ` ${face.position}`;
                    }
                    if (face.clothing) {
                        desc += lang === 'rw' ? ` yambaye ${face.clothing}` : ` wearing ${face.clothing}`;
                    }
                    parts.push(desc);
                }
                
                // Describe objects
                for (let obj of objects) {
                    let desc = obj.class;
                    if (obj.position) {
                        desc += lang === 'rw' ? ` ${obj.position}` : ` ${obj.position}`;
                    }
                    parts.push(desc);
                }
                
                if (parts.length > 0) {
                    const msg = lang === 'rw' ? 
                        `Ndabona: ${parts.join(', ')}` : 
                        `I see: ${parts.join(', ')}`;
                    speak(msg);
                }
            }
            
            // ============================================================
            // CAMERA INITIALIZATION
            // ============================================================
            async function initCamera() {
                try {
                    const constraints = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            frameRate: { ideal: 15 }
                        },
                        audio: false
                    };
                    
                    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = state.stream;
                    await video.play();
                    
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    state.isRunning = true;
                    statusDot.className = 'dot green';
                    statusText.textContent = 'LIVE';
                    statusText.className = 'status-text active';
                    
                    // Start voice recognition
                    state.recognition = initVoiceRecognition();
                    if (state.recognition) {
                        try { 
                            state.recognition.start(); 
                            console.log(' Voice recognition started');
                        } catch(e) {
                            console.warn('Could not start recognition:', e);
                        }
                    }
                    
                    processFrame();
                    
                    // Auto-describe every 5 seconds
                    setInterval(() => {
                        if (state.detectedFaces.length > 0 || state.detectedObjects.length > 0) {
                            const now = Date.now();
                            if (now - state.lastDescriptionTime > state.descriptionCooldown) {
                                state.lastDescriptionTime = now;
                                describeScene();
                            }
                        }
                    }, 5000);
                    
                    return true;
                } catch (err) {
                    console.error('Camera error:', err);
                    statusDot.className = 'dot red';
                    statusText.textContent = 'NO CAMERA';
                    statusText.className = 'status-text';
                    return false;
                }
            }
            
            // ============================================================
            // FACE RECOGNITION
            // ============================================================
            async function recognizeFaces(imageData) {
                try {
                    const detCanvas = document.createElement('canvas');
                    detCanvas.width = imageData.width;
                    detCanvas.height = imageData.height;
                    const detCtx = detCanvas.getContext('2d');
                    detCtx.putImageData(imageData, 0, 0);
                    const base64 = detCanvas.toDataURL('image/jpeg').split(',')[1];
                    
                    const response = await fetch('/api/recognize_face', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            image: base64,
                            language: state.currentLanguage
                        })
                    });
                    
                    const data = await response.json();
                    return data.faces || [];
                } catch (err) {
                    console.warn('Face recognition error:', err);
                    return [];
                }
            }
            
            // ============================================================
            // OBJECT DETECTION
            // ============================================================
            let objectModel = null;
            
            async function loadObjectModel() {
                try {
                    if (window.tf && window.cocoSsd) {
                        objectModel = await window.cocoSsd.load();
                        console.log(' Object detection loaded');
                        return true;
                    }
                    return false;
                } catch (err) {
                    console.warn('Object detection not available:', err);
                    return false;
                }
            }
            
            async function detectObjects(imageData) {
                if (!objectModel) return [];
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = imageData.width;
                    canvas.height = imageData.height;
                    const c = canvas.getContext('2d');
                    c.putImageData(imageData, 0, 0);
                    const predictions = await objectModel.detect(canvas);
                    return predictions.map(p => ({
                        class: p.class,
                        confidence: p.score,
                        x: p.bbox[0],
                        y: p.bbox[1],
                        width: p.bbox[2],
                        height: p.bbox[3],
                        center_x: p.bbox[0] + p.bbox[2]/2
                    }));
                } catch (err) {
                    return [];
                }
            }
            
            // ============================================================
            // GET POSITION
            // ============================================================
            async function getObjectPosition(x, width) {
                try {
                    const response = await fetch('/api/object_position', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            x: x, 
                            width: width,
                            language: state.currentLanguage
                        })
                    });
                    const data = await response.json();
                    return data.position;
                } catch (err) {
                    return '';
                }
            }
            
            // ============================================================
            // CLOTHING DETECTION
            // ============================================================
            function detectClothing(faceBox, imageData) {
                try {
                    const [x1, y1, x2, y2] = faceBox;
                    const faceHeight = y2 - y1;
                    const bodyY1 = y2;
                    const bodyY2 = Math.min(y2 + faceHeight * 1.5, imageData.height);
                    const bodyX1 = Math.max(x1 - faceHeight * 0.2, 0);
                    const bodyX2 = Math.min(x2 + faceHeight * 0.2, imageData.width);
                    
                    if (bodyY2 > bodyY1 && bodyX2 > bodyX1) {
                        const samples = [];
                        const step = 6;
                        for (let y = bodyY1; y < bodyY2; y += step) {
                            for (let x = bodyX1; x < bodyX2; x += step) {
                                const idx = (y * imageData.width + x) * 4;
                                if (idx + 3 < imageData.data.length) {
                                    const r = imageData.data[idx];
                                    const g = imageData.data[idx + 1];
                                    const b = imageData.data[idx + 2];
                                    if (r + g + b > 50) {
                                        samples.push([r, g, b]);
                                    }
                                }
                            }
                        }
                        
                        if (samples.length > 20) {
                            const avgR = samples.reduce((sum, s) => sum + s[0], 0) / samples.length;
                            const avgG = samples.reduce((sum, s) => sum + s[1], 0) / samples.length;
                            const avgB = samples.reduce((sum, s) => sum + s[2], 0) / samples.length;
                            
                            const colors = {
                                'red': [200, 80, 80],
                                'green': [80, 200, 80],
                                'blue': [80, 80, 200],
                                'yellow': [200, 200, 80],
                                'purple': [200, 80, 200],
                                'teal': [80, 200, 200],
                                'white': [200, 200, 200],
                                'black': [50, 50, 50],
                                'orange': [200, 150, 80],
                                'pink': [200, 150, 200],
                                'gray': [150, 150, 150]
                            };
                            
                            let bestMatch = 'colored';
                            let bestDist = Infinity;
                            for (let [name, [cr, cg, cb]] of Object.entries(colors)) {
                                const dist = Math.sqrt((avgR-cr)**2 + (avgG-cg)**2 + (avgB-cb)**2);
                                if (dist < bestDist) {
                                    bestDist = dist;
                                    bestMatch = name;
                                }
                            }
                            return bestMatch;
                        }
                    }
                    return '';
                } catch (err) {
                    return '';
                }
            }
            
            // ============================================================
            // MAIN PROCESSING LOOP
            // ============================================================
            async function processFrame() {
                if (!state.isRunning) return;
                const now = performance.now();
                try {
                    state.frameCount++;
                    if (now - state.lastFpsUpdate > 1000) {
                        state.fps = state.frameCount;
                        state.frameCount = 0;
                        state.lastFpsUpdate = now;
                        fpsDisplay.textContent = `${state.fps} FPS`;
                    }
                    const vw = video.videoWidth || 640;
                    const vh = video.videoHeight || 480;
                    if (vw === 0 || vh === 0) {
                        requestAnimationFrame(processFrame);
                        return;
                    }
                    if (canvas.width !== vw || canvas.height !== vh) {
                        canvas.width = vw;
                        canvas.height = vh;
                    }
                    ctx.drawImage(video, 0, 0, vw, vh);
                    const imageData = ctx.getImageData(0, 0, vw, vh);
                    
                    if (state.frameCount % 2 === 0) {
                        // Face recognition
                        const faces = await recognizeFaces(imageData);
                        for (let face of faces) {
                            face.clothing = detectClothing(face.box, imageData);
                        }
                        
                        // Object detection
                        const objects = await detectObjects(imageData);
                        for (let obj of objects) {
                            const pos = await getObjectPosition(obj.center_x, vw);
                            obj.position = pos;
                        }
                        
                        state.detectedFaces = faces;
                        state.detectedObjects = objects;
                        updateUI(faces, objects);
                    }
                    drawOverlays(state.detectedFaces, state.detectedObjects);
                } catch (err) {}
                requestAnimationFrame(processFrame);
            }
            
            // ============================================================
            // UI UPDATES
            // ============================================================
            function updateUI(faces, objects) {
                faceCount.textContent = faces.length;
                objectCount.textContent = objects.length;
                faceTags.innerHTML = '';
                faces.slice(0, 5).forEach((face) => {
                    const tag = document.createElement('div');
                    tag.className = `face-tag ${face.is_known ? 'known' : 'unknown'}`;
                    let label = face.name;
                    if (face.position) label += ` ${face.position}`;
                    if (face.clothing) label += ` (${face.clothing})`;
                    tag.innerHTML = `${face.is_known ? '' : ''} ${label}`;
                    faceTags.appendChild(tag);
                });
            }
            
            function drawOverlays(faces, objects) {
                const vw = canvas.width;
                const vh = canvas.height;
                ctx.clearRect(0, 0, vw, vh);
                
                faces.forEach(face => {
                    const x = face.x || 0, y = face.y || 0, w = face.width || 0, h = face.height || 0;
                    const color = face.is_known ? '#00ff88' : '#ffcc00';
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 8;
                    ctx.strokeRect(x, y, w, h);
                    ctx.shadowBlur = 0;
                    
                    let label = face.name;
                    if (face.position) label += ` ${face.position}`;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    const metrics = ctx.measureText(label);
                    ctx.fillRect(x, y - 22, metrics.width + 16, 22);
                    ctx.fillStyle = color;
                    ctx.font = '12px sans-serif';
                    ctx.fillText(label, x + 4, y - 4);
                });
                
                objects.forEach(obj => {
                    const x = obj.x || 0, y = obj.y || 0, w = obj.width || 0, h = obj.height || 0;
                    ctx.strokeStyle = '#4488ff';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4,4]);
                    ctx.strokeRect(x, y, w, h);
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(68,136,255,0.1)';
                    ctx.fillRect(x, y, w, h);
                    
                    let label = obj.class;
                    if (obj.position) label += ` ${obj.position}`;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    const metrics = ctx.measureText(label);
                    ctx.fillRect(x, y - 18, metrics.width + 14, 18);
                    ctx.fillStyle = '#4488ff';
                    ctx.font = '10px sans-serif';
                    ctx.fillText(label, x + 3, y - 3);
                });
            }
            
            // ============================================================
            // INITIALIZATION
            // ============================================================
            async function init() {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
                
                await loadObjectModel();
                await initCamera();
                
                // Welcome message in Kinyarwanda (default)
                setTimeout(() => {
                    speak('Sisitemu iteguye. Ndagukundira. Niba ushaka Kongereza, vuga "English".');
                }, 1500);
            }
            
            // Start when ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
            
        })();
    </script>
</body>
</html>
